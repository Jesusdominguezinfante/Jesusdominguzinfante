<svg width="900" height="410" viewBox="0 0 900 410" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    .title {
      font-family: 'Segoe UI', 'Trebuchet MS', sans-serif;
      font-weight: 800;
      font-size: 17px;
      fill: #FFFFFF;
      letter-spacing: 0.8px;
    }
    .body-text {
      font-family: 'Segoe UI', sans-serif;
      font-size: 13.5px;
      fill: #E6EDF3;
    }
    .email-link {
      font-family: 'Segoe UI', sans-serif;
      font-size: 13.5px;
      fill: #58A6FF;
      text-decoration: underline;
    }

    @keyframes driftSlow {
      0%, 100% { transform: translateY(-2.5px); }
      50% { transform: translateY(2.5px); }
    }
    @keyframes driftReverse {
      0%, 100% { transform: translateY(2.5px); }
      50% { transform: translateY(-2.5px); }
    }

    .float-a { animation: driftSlow 4.5s ease-in-out infinite; }
    .float-b { animation: driftReverse 5.2s ease-in-out infinite; }
    .float-c { animation: driftSlow 4.8s ease-in-out infinite; }
    .float-d { animation: driftReverse 5.5s ease-in-out infinite; }
  </style>

  <defs>
    <clipPath id="clip-top">
      <rect x="1" y="1" width="898" height="174" rx="6"/>
    </clipPath>
    <clipPath id="clip-bot-1">
      <rect x="1" y="175" width="299" height="234"/>
    </clipPath>
    <clipPath id="clip-bot-2">
      <rect x="300" y="175" width="300" height="234"/>
    </clipPath>
    <clipPath id="clip-bot-3">
      <rect x="600" y="175" width="299" height="234"/>
    </clipPath>
    <clipPath id="clip-outer">
      <rect x="1" y="1" width="898" height="408" rx="6"/>
    </clipPath>
  </defs>

  <!-- FONDO BASE OSCURO -->
  <rect x="1" y="1" width="898" height="408" rx="6" fill="#0D1117"/>

  <g clip-path="url(#clip-outer)">
    <!-- ONDAS DE FONDO: CELDA SUPERIOR (MY APPROACH) -->
    <g clip-path="url(#clip-top)">
      <path fill="#D93D37" fill-opacity="0.18">
        <animate attributeName="d" dur="7s" repeatCount="indefinite"
          values="
            M0,130 C225,165 335,100 450,130 C565,160 675,100 900,130 L900,176 L0,176 Z;
            M0,130 C200,100 360,165 450,130 C580,100 700,165 900,130 L900,176 L0,176 Z;
            M0,130 C225,165 335,100 450,130 C565,160 675,100 900,130 L900,176 L0,176 Z
          " />
      </path>
      <path fill="#D93D37" fill-opacity="0.28">
        <animate attributeName="d" dur="5.5s" repeatCount="indefinite"
          values="
            M0,142 C200,115 350,170 450,142 C550,115 700,170 900,142 L900,176 L0,176 Z;
            M0,142 C250,170 320,115 450,142 C580,170 680,115 900,142 L900,176 L0,176 Z;
            M0,142 C200,115 350,170 450,142 C550,115 700,170 900,142 L900,176 L0,176 Z
          " />
      </path>
      <path fill="#D93D37" fill-opacity="0.42">
        <animate attributeName="d" dur="4.5s" repeatCount="indefinite"
          values="
            M0,154 C240,175 340,130 450,154 C560,175 660,130 900,154 L900,176 L0,176 Z;
            M0,154 C210,130 370,175 450,154 C530,130 690,175 900,154 L900,176 L0,176 Z;
            M0,154 C240,175 340,130 450,154 C560,175 660,130 900,154 L900,176 L0,176 Z
          " />
      </path>
    </g>

    <!-- ONDAS DE FONDO: COLUMNA INFERIOR 1 (MY MINDSET) -->
    <g clip-path="url(#clip-bot-1)">
      <path fill="#D93D37" fill-opacity="0.18">
        <animate attributeName="d" dur="6.5s" repeatCount="indefinite"
          values="
            M0,350 C75,385 110,320 150,350 C190,380 225,320 300,350 L300,410 L0,410 Z;
            M0,350 C65,320 120,385 150,350 C180,320 235,385 300,350 L300,410 L0,410 Z;
            M0,350 C75,385 110,320 150,350 C190,380 225,320 300,350 L300,410 L0,410 Z
          " />
      </path>
      <path fill="#D93D37" fill-opacity="0.30">
        <animate attributeName="d" dur="5s" repeatCount="indefinite"
          values="
            M0,365 C70,335 115,390 150,365 C185,335 230,390 300,365 L300,410 L0,410 Z;
            M0,365 C85,390 105,335 150,365 C195,390 220,335 300,365 L300,410 L0,410 Z;
            M0,365 C70,335 115,390 150,365 C185,335 230,390 300,365 L300,410 L0,410 Z
          " />
      </path>
      <path fill="#D93D37" fill-opacity="0.45">
        <animate attributeName="d" dur="4s" repeatCount="indefinite"
          values="
            M0,380 C80,400 110,355 150,380 C190,400 220,355 300,380 L300,410 L0,410 Z;
            M0,380 C70,355 120,400 150,380 C180,355 230,400 300,380 L300,410 L0,410 Z;
            M0,380 C80,400 110,355 150,380 C190,400 220,355 300,380 L300,410 L0,410 Z
          " />
      </path>
    </g>

