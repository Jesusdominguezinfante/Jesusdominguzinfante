    <g clip-path="url(#clip-bot-2)">
      <path fill="#D93D37" fill-opacity="0.18">
        <animate attributeName="d" dur="7.2s" repeatCount="indefinite"
          values="
            M300,350 C365,320 420,385 450,350 C480,320 535,385 600,350 L600,410 L300,410 Z;
            M300,350 C375,385 410,320 450,350 C490,380 525,320 600,350 L600,410 L300,410 Z;
            M300,350 C365,320 420,385 450,350 C480,320 535,385 600,350 L600,410 L300,410 Z
          " />
      </path>
      <path fill="#D93D37" fill-opacity="0.30">
        <animate attributeName="d" dur="5.4s" repeatCount="indefinite"
          values="
            M300,365 C385,390 405,335 450,365 C495,390 520,335 600,365 L600,410 L300,410 Z;
            M300,365 C370,335 415,390 450,365 C485,335 530,390 600,365 L600,410 L300,410 Z;
            M300,365 C385,390 405,335 450,365 C495,390 520,335 600,365 L600,410 L300,410 Z
          " />
      </path>
      <path fill="#D93D37" fill-opacity="0.45">
        <animate attributeName="d" dur="4.3s" repeatCount="indefinite"
          values="
            M300,380 C370,355 420,400 450,380 C480,355 530,400 600,380 L600,410 L300,410 Z;
            M300,380 C380,400 410,355 450,380 C490,400 520,355 600,380 L600,410 L300,410 Z;
            M300,380 C370,355 420,400 450,380 C480,355 530,400 600,380 L600,410 L300,410 Z
          " />
      </path>
    </g>

    <!-- ONDAS DE FONDO: COLUMNA INFERIOR 3 (CONTACT) -->
    <g clip-path="url(#clip-bot-3)">
      <path fill="#D93D37" fill-opacity="0.18">
        <animate attributeName="d" dur="6.8s" repeatCount="indefinite"
          values="
            M600,350 C675,385 710,320 750,350 C790,380 825,320 900,350 L900,410 L600,410 Z;
            M600,350 C665,320 720,385 750,350 C780,320 835,385 900,350 L900,410 L600,410 Z;
            M600,350 C675,385 710,320 750,350 C790,380 825,320 900,350 L900,410 L600,410 Z
          " />
      </path>
      <path fill="#D93D37" fill-opacity="0.30">
        <animate attributeName="d" dur="5.1s" repeatCount="indefinite"
          values="
            M600,365 C670,335 715,390 750,365 C785,335 830,390 900,365 L900,410 L600,410 Z;
            M600,365 C685,390 705,335 750,365 C795,390 820,335 900,365 L900,410 L600,410 Z;
            M600,365 C670,335 715,390 750,365 C785,335 830,390 900,365 L900,410 L600,410 Z
          " />
      </path>
      <path fill="#D93D37" fill-opacity="0.45">
        <animate attributeName="d" dur="4.2s" repeatCount="indefinite"
          values="
            M600,380 C680,400 710,355 750,380 C790,400 820,355 900,380 L900,410 L600,410 Z;
            M600,380 C670,355 720,400 750,380 C780,355 830,400 900,380 L900,410 L600,410 Z;
            M600,380 C680,400 710,355 750,380 C790,400 820,355 900,380 L900,410 L600,410 Z
          " />
      </path>
    </g>
  </g>

  <!-- BORDES DE REJILLA -->
  <rect x="1" y="1" width="898" height="408" rx="6" stroke="#30363D" stroke-width="1.5"/>
  <line x1="1" y1="175" x2="899" y2="175" stroke="#30363D" stroke-width="1.5"/>
  <line x1="300" y1="175" x2="300" y2="409" stroke="#30363D" stroke-width="1.5"/>
  <line x1="600" y1="175" x2="600" y2="409" stroke="#30363D" stroke-width="1.5"/>

  <!-- CONTENIDO: FILA SUPERIOR (MY APPROACH) -->
  <g class="float-a">
    <!-- ESPACIO PARA TU ICONO 1 (x="24" y="24") -->
    <text x="24" y="42" class="title">My Approach:</text>
    <text x="24" y="75" class="body-text">
      <tspan x="24" dy="0">I love writing clean code, building practical solutions, and constantly learning new technologies. I am proactive, detail-</tspan>
      <tspan x="24" dy="22">oriented, and enjoy solving complex problems. I thrive in collaborative environments and adapt quickly to new challenges.</tspan>
      <tspan x="24" dy="22">Currently, I am focused on learning new things and expanding my core foundations.</tspan>
    </text>
  </g>

  <!-- CONTENIDO: COLUMNA INFERIOR 1 (MY MINDSET) -->
  <g class="float-b">
    <!-- ESPACIO PARA TU ICONO 2 (x="24" y="198") -->
    <text x="24" y="216" class="title">My Mindset:</text>
    <text x="24" y="250" class="body-text">
      <tspan x="24" dy="0">I consider myself a patient person who</tspan>
      <tspan x="24" dy="22">enjoys helping others. I believe every</tspan>
      <tspan x="24" dy="22">challenge is an opportunity to grow, and I</tspan>
      <tspan x="24" dy="22">always bring positive energy to myself and</tspan>
      <tspan x="24" dy="22">the people I care about.</tspan>
    </text>
  </g>

  <!-- CONTENIDO: COLUMNA INFERIOR 2 (BEYOND CODE) -->
  <g class="float-c">
    <!-- ESPACIO PARA TU ICONO 3 (x="324" y="198") -->
    <text x="324" y="216" class="title">Beyond Code:</text>
    <text x="324" y="250" class="body-text">
      <tspan x="324" dy="0">My biggest hobbies are movies and TV</tspan>
      <tspan x="324" dy="22">series, though I'm also a big fan of video</tspan>
      <tspan x="324" dy="22">games. And music is always with me</tspan>
      <tspan x="324" dy="22">wherever I go.</tspan>
    </text>
  </g>

  <!-- CONTENIDO: COLUMNA INFERIOR 3 (CONTACT) -->
  <g class="float-d">
    <!-- ESPACIO PARA TU ICONO 4 (x="624" y="198") -->
    <text x="624" y="216" class="title">Contact:</text>
    <text x="624" y="250" class="body-text">
      <tspan x="624" dy="0">If you would like to contact me:</tspan>
      <tspan x="624" dy="24" class="email-link">jesusdominguezinfante@gmail.com</tspan>
    </text>
  </g>
</svg>
